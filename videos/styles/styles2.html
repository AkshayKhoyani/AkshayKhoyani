<!doctype html>
<html><head><meta charset="utf-8"><title>12 more reel styles</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// 12 MORE style frames (13-24), SAME content: RBI 4 Dec 2026 + Bank Nifty.
const W = 1080, H = 1920, c = document.getElementById('c'), x = c.getContext('2d');
const F = (w, s, f = 'Inter') => `${w} ${s}px ${f}, "Noto Color Emoji", sans-serif`;
const L = s => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = s; });
let IMG = {};
const R = (() => { let s = 7; return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; })();
function rr(X, Y, w, h, r) { r = Math.min(r, w / 2, h / 2); x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r); x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath(); }
function T(s, X, Y, o = {}) {
  const { size = 60, w = 800, c: col = '#fff', a = 'center', maxW = 1000, f = 'Inter', sh = 0, stroke = null, rot = 0, ls = 0, grad = null } = o;
  x.save(); x.font = F(w, size, f); if (ls) x.letterSpacing = ls + 'px';
  let k = 1; const mw = x.measureText(s).width; if (mw > maxW) k = maxW / mw;
  x.translate(X, Y); x.rotate(rot); x.scale(k, k); x.textAlign = a; x.textBaseline = 'middle';
  if (sh) { x.shadowColor = typeof sh === 'string' ? sh : 'rgba(0,0,0,0.6)'; x.shadowBlur = 30; }
  if (stroke) { x.lineWidth = stroke[1]; x.strokeStyle = stroke[0]; x.lineJoin = 'round'; x.strokeText(s, 0, 0); }
  if (grad) { const g = x.createLinearGradient(0, -size / 2, 0, size / 2); grad.forEach((cc, i) => g.addColorStop(i / (grad.length - 1), cc)); x.fillStyle = g; x.fillText(s, 0, 0); }
  else if (col) { x.fillStyle = col; x.fillText(s, 0, 0); }
  x.restore();
}
function cover(img, dim = 0) { const s = Math.max(W / img.width, H / img.height); const w = img.width * s, h = img.height * s; x.drawImage(img, (W - w) / 2, (H - h) / 2, w, h); if (dim) { x.fillStyle = `rgba(0,0,0,${dim})`; x.fillRect(0, 0, W, H); } }
function badge(dark = true) { x.save(); rr(48, 56, 96, 96, 22); x.fillStyle = '#fff'; x.fill(); x.drawImage(IMG.logo, 250, 75, 755, 755, 58, 66, 76, 76); x.restore(); T('FINANCE JUNCTION', 166, 104, { size: 30, w: 900, a: 'left', c: dark ? '#f8fafc' : '#0b2545', ls: 2 }); }
function label(n, name) { x.fillStyle = 'rgba(0,0,0,0.78)'; rr(40, 1790, 1000, 90, 20); x.fill(); T(`STYLE ${n}`, 80, 1835, { size: 34, w: 900, a: 'left', c: '#f4cf6a' }); T(name, 1010, 1835, { size: 38, w: 800, a: 'right', c: '#fff', maxW: 720 }); }
const GOLD = ['#fff3c4', '#f4cf6a', '#b8860b', '#f4cf6a'];
const S = {};
// 13 Luxury black & gold
S[13] = () => {
  x.fillStyle = '#060606'; x.fillRect(0, 0, W, H);
  for (let i = 0; i < 160; i++) { x.fillStyle = `rgba(244,207,106,${R() * 0.5})`; x.beginPath(); x.arc(R() * W, R() * H, R() * 2.5, 0, 7); x.fill(); }
  const g = x.createRadialGradient(540, 800, 0, 540, 800, 700); g.addColorStop(0, 'rgba(244,207,106,0.12)'); g.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = g; x.fillRect(0, 0, W, H);
  badge();
  x.strokeStyle = '#b8860b'; x.lineWidth = 2; x.strokeRect(90, 330, 900, 1300); x.strokeRect(105, 345, 870, 1270);
  T('THE RESERVE BANK DECISION', 540, 470, { size: 34, w: 500, c: '#d4b05a', ls: 10 });
  T('4', 540, 760, { size: 380, w: 300, grad: GOLD });
  T('DECEMBER', 540, 1000, { size: 96, w: 300, grad: GOLD, ls: 20 });
  x.fillStyle = '#b8860b'; x.fillRect(440, 1090, 200, 2);
  T('Repo 5.50%  ·  Bank Nifty 62,000', 540, 1180, { size: 40, w: 400, c: '#e8dcc0', ls: 2 });
  T('Ek faisla. Poora market.', 540, 1400, { size: 60, w: 300, c: '#ffffff' });
  label(13, 'Luxury Black & Gold');
};
// 14 Paper cut-out collage
S[14] = () => {
  x.fillStyle = '#e9dfcc'; x.fillRect(0, 0, W, H);
  const paper = (pts, col, sh = true) => { x.save(); if (sh) { x.shadowColor = 'rgba(0,0,0,0.3)'; x.shadowBlur = 18; x.shadowOffsetY = 10; } x.fillStyle = col; x.beginPath(); pts.forEach(([a, b], i) => i ? x.lineTo(a, b) : x.moveTo(a, b)); x.closePath(); x.fill(); x.restore(); };
  const torn = (X, Y, w, h, col, rot = 0) => { x.save(); x.translate(X + w / 2, Y + h / 2); x.rotate(rot); const p = []; for (let i = 0; i <= 20; i++) p.push([-w / 2 + w * i / 20, -h / 2 + (R() - 0.5) * 12]); for (let i = 20; i >= 0; i--) p.push([-w / 2 + w * i / 20, h / 2 + (R() - 0.5) * 12]); paper(p, col); x.restore(); };
  badge(false);
  torn(60, 260, 960, 300, '#0b2545', -0.02); T('RBI KA FAISLA', 540, 410, { size: 110, w: 900, c: '#f4cf6a', rot: -0.02 });
  torn(140, 600, 800, 160, '#ffffff', 0.03); T('4 DECEMBER 2026', 540, 680, { size: 76, w: 900, c: '#b91c1c', rot: 0.03 });
  // paper building
  paper([[240, 1350], [840, 1350], [840, 1380], [240, 1380]], '#c2b59b');
  paper([[260, 1000], [540, 860], [820, 1000]], '#f4cf6a');
  for (let i = 0; i < 5; i++) paper([[300 + i * 110, 1010], [350 + i * 110, 1010], [350 + i * 110, 1340], [300 + i * 110, 1340]], '#ffffff');
  torn(620, 1150, 380, 200, '#22c55e', -0.06); T('Bank Nifty', 810, 1215, { size: 44, w: 800, c: '#06331b', rot: -0.06 }); T('62,000', 810, 1290, { size: 70, w: 900, c: '#06331b', rot: -0.06 });
  torn(80, 1450, 520, 160, '#fca5a5', 0.04); T('Repo 5.50% → ?', 340, 1530, { size: 56, w: 900, c: '#7f1d1d', rot: 0.04 });
  label(14, 'Paper Cut-out Collage (stop-motion)');
};
// 15 Clay 3D (AI)
S[15] = () => {

  x.fillStyle = 'rgba(255,255,255,0.0)'; badge(false);
  x.save(); rr(90, 260, 900, 330, 60); x.fillStyle = 'rgba(255,255,255,0.85)'; x.shadowColor = 'rgba(0,0,0,0.15)'; x.shadowBlur = 30; x.fill(); x.restore();
  T('4 Dec 2026', 540, 350, { size: 70, w: 900, c: '#ef6c57' });
  T('RBI ka faisla 🏦', 540, 450, { size: 92, w: 900, c: '#334155' });
  T('Repo 5.50% · Bank Nifty 62,000', 540, 535, { size: 38, w: 700, c: '#64748b' });
  label(15, 'Clay 3D (claymation, AI)');
};
// 16 Flat vector illustration (AI)
S[16] = () => {
  cover(IMG.flat); badge(false);
  x.save(); x.fillStyle = '#0b2545'; rr(70, 250, 940, 360, 24); x.fill(); x.restore();
  T('RBI vs BANK NIFTY', 540, 340, { size: 84, w: 900, c: '#f4cf6a' });
  T('4 December: rate badhega?', 540, 440, { size: 60, w: 800, c: '#ffffff' });
  T('Pichli baar Auto -1.4%, Realty -0.7%', 540, 530, { size: 40, w: 600, c: '#fda4af' });

};
// 17 Notes app
S[17] = () => {
  x.fillStyle = '#fffdf5'; x.fillRect(0, 0, W, H);
  x.fillStyle = '#f7f3e3'; x.fillRect(0, 0, W, 240); T('‹ Notes', 60, 170, { size: 44, w: 600, a: 'left', c: '#e0a800' }); T('Done', 1020, 170, { size: 44, w: 700, a: 'right', c: '#e0a800' });
  T('23 November 2026 at 9:41 PM', 540, 300, { size: 30, w: 500, c: '#9a9a9a' });
  T('RBI 4 Dec: kya dekhna hai 📝', 70, 420, { size: 64, w: 900, a: 'left', c: '#1c1c1e', maxW: 940 });
  const item = (s, Y, done) => { x.strokeStyle = done ? '#e0a800' : '#c7c7cc'; x.lineWidth = 4; x.beginPath(); x.arc(100, Y, 26, 0, 7); x.stroke(); if (done) { x.fillStyle = '#e0a800'; x.beginPath(); x.arc(100, Y, 26, 0, 7); x.fill(); T('✓', 100, Y + 2, { size: 34, w: 900 }); } T(s, 150, Y, { size: 46, w: 500, a: 'left', c: done ? '#8e8e93' : '#1c1c1e', maxW: 880 }); };
  item('Repo abhi 5.50% (Oct mein +0.25%)', 560, true);

  item('SBI ka andaaza: +0.25%', 780, true);
  item('Bank Nifty record 62,000 🚀', 890, true);
  item('Pichli baar: Auto ↓ Realty ↓ Banks ↑', 1000, false);
  item('30 Nov: GDP data', 1110, false);
  item('9 Dec: US Fed', 1220, false);
  T('— Finance Junction', 1010, 1380, { size: 40, w: 500, a: 'right', c: '#9a9a9a' });

};
// 18 Comic book
S[18] = () => {
  x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
  const panel = (X, Y, w, h, col) => { x.fillStyle = col; x.fillRect(X, Y, w, h); for (let yy = Y; yy < Y + h; yy += 18) for (let xx = X; xx < X + w; xx += 18) { x.fillStyle = 'rgba(0,0,0,0.08)'; x.beginPath(); x.arc(xx, yy, 4, 0, 7); x.fill(); } x.lineWidth = 10; x.strokeStyle = '#000'; x.strokeRect(X, Y, w, h); };
  panel(40, 200, 1000, 520, '#fde047'); badge(false);
  const burst = (X, Y, r, col) => { x.fillStyle = col; x.beginPath(); for (let i = 0; i < 28; i++) { const a = i / 28 * Math.PI * 2, rad = i % 2 ? r : r * 0.62; x.lineTo(X + Math.cos(a) * rad, Y + Math.sin(a) * rad); } x.closePath(); x.fill(); x.lineWidth = 8; x.strokeStyle = '#000'; x.stroke(); };
  burst(540, 470, 330, '#ef4444'); T('4 DEC!', 540, 430, { size: 150, w: 900, c: '#fff', stroke: ['#000', 14], rot: -0.08 }); T('RBI', 540, 560, { size: 110, w: 900, c: '#fde047', stroke: ['#000', 12], rot: -0.08 });
  panel(40, 750, 480, 620, '#60a5fa'); panel(560, 750, 480, 620, '#4ade80');
  const bubble = (X, Y, w, h, s) => { x.fillStyle = '#fff'; rr(X, Y, w, h, 40); x.fill(); x.lineWidth = 6; x.strokeStyle = '#000'; x.stroke(); T(s, X + w / 2, Y + h / 2, { size: 40, w: 900, c: '#000', maxW: w - 40 }); };
  bubble(70, 790, 420, 180, 'Rate badhega?! 😱'); T('REPO', 280, 1110, { size: 80, w: 900, c: '#fff', stroke: ['#000', 10] }); T('5.50%', 280, 1230, { size: 110, w: 900, c: '#fde047', stroke: ['#000', 12] });
  bubble(590, 790, 420, 180, 'Main record pe hoon! 🚀'); T('BANK NIFTY', 800, 1110, { size: 64, w: 900, c: '#fff', stroke: ['#000', 10] }); T('62,000', 800, 1230, { size: 110, w: 900, c: '#fde047', stroke: ['#000', 12] });
  panel(40, 1400, 1000, 300, '#f472b6'); T('KAUN JEETEGA?', 540, 1550, { size: 120, w: 900, c: '#fff', stroke: ['#000', 14] });
  label(18, 'Comic Book (pop art)');
};
// 19 Retro TV news
S[19] = () => {
  x.fillStyle = '#1a1410'; x.fillRect(0, 0, W, H); badge();
  x.save(); rr(60, 300, 960, 1150, 80); x.fillStyle = '#3b2f25'; x.fill(); rr(110, 350, 860, 900, 60); x.fillStyle = '#0a2a3a'; x.fill(); x.restore();
  x.save(); rr(110, 350, 860, 900, 60); x.clip();
  const g = x.createRadialGradient(540, 800, 100, 540, 800, 600); g.addColorStop(0, '#1d5b74'); g.addColorStop(1, '#06141c'); x.fillStyle = g; x.fillRect(110, 350, 860, 900);
  T('SAMACHAR', 540, 470, { size: 90, w: 900, c: '#fef08a', ls: 8 });
  x.fillStyle = '#b91c1c'; x.fillRect(110, 560, 860, 120); T('RBI NITI · 4 DECEMBER', 540, 620, { size: 64, w: 900, c: '#fff' });
  T('Repo dar: 5.50%', 540, 790, { size: 72, w: 800, c: '#fff' }); T('Mehngai: 6.09%', 540, 900, { size: 72, w: 800, c: '#fca5a5' }); T('Bank Nifty: 62,000', 540, 1010, { size: 72, w: 800, c: '#86efac' });
  for (let yy = 350; yy < 1250; yy += 6) { x.fillStyle = 'rgba(0,0,0,0.25)'; x.fillRect(110, yy, 860, 2); }
  x.fillStyle = 'rgba(255,255,255,0.05)'; x.fillRect(110, 350, 860, 120);
  x.restore();
  [[300, 1350], [440, 1350]].forEach(([a, b]) => { x.fillStyle = '#c9a77a'; x.beginPath(); x.arc(a, b, 45, 0, 7); x.fill(); });
  T('90s TV vibe 📺', 760, 1350, { size: 54, w: 800, c: '#e8d5b5' });
  label(19, 'Retro TV News (nostalgia)');
};
// 20 Globe data
S[20] = () => {
  x.fillStyle = '#020617'; x.fillRect(0, 0, W, H); badge();
  for (let i = 0; i < 200; i++) { x.fillStyle = `rgba(255,255,255,${R() * 0.6})`; x.fillRect(R() * W, R() * H, 2, 2); }
  const cx = 540, cy = 1000, r = 430; const g = x.createRadialGradient(cx - 120, cy - 150, 50, cx, cy, r); g.addColorStop(0, '#1e3a8a'); g.addColorStop(1, '#020b2a'); x.fillStyle = g; x.beginPath(); x.arc(cx, cy, r, 0, 7); x.fill();
  x.strokeStyle = 'rgba(96,165,250,0.35)'; x.lineWidth = 2; for (let i = -3; i <= 3; i++) { x.beginPath(); x.ellipse(cx, cy, r * Math.cos(i * 0.4) , r, 0, 0, 7); x.stroke(); x.beginPath(); x.ellipse(cx, cy + i * 120, r * Math.sqrt(1 - Math.pow(i * 120 / r, 2)), 30, 0, 0, 7); x.stroke(); }
  const pt = (X, Y, col, lab) => { x.fillStyle = col; x.shadowColor = col; x.shadowBlur = 20; x.beginPath(); x.arc(X, Y, 16, 0, 7); x.fill(); x.shadowBlur = 0; T(lab, X, Y - 50, { size: 40, w: 800, c: '#fff' }); };
  x.strokeStyle = '#f4cf6a'; x.lineWidth = 6; x.shadowColor = '#f4cf6a'; x.shadowBlur = 20; x.beginPath(); x.moveTo(300, 900); x.quadraticCurveTo(480, 560, 740, 1050); x.stroke(); x.shadowBlur = 0;
  pt(300, 900, '#60a5fa', 'US Fed · 9 Dec'); pt(740, 1050, '#f4cf6a', 'RBI · 4 Dec');
  T('Do faisle. Ek hafta.', 540, 330, { size: 84, w: 900 }); T('Duniya ka paisa kidhar jayega?', 540, 430, { size: 48, w: 600, c: '#93c5fd' });
  T('FII Nov: record kharidari', 540, 1560, { size: 50, w: 700, c: '#86efac' });
  label(20, 'Globe / World Data');
};
// 21 LED dot-matrix board
S[21] = () => {
  x.fillStyle = '#0a0a0a'; x.fillRect(0, 0, W, H); badge();
  const led = (s, Y, col, size = 26) => { const cv = document.createElement('canvas'); cv.width = 1000; cv.height = 120; const g = cv.getContext('2d'); g.font = F(900, 104); g.fillStyle = '#fff'; g.textBaseline = 'middle'; g.textAlign = 'center'; g.fillText(s, 500, 62); const d = g.getImageData(0, 0, 1000, 120).data;
    for (let yy = 0; yy < 120; yy += 6) for (let xx = 0; xx < 1000; xx += 6) { const on = d[(yy * 1000 + xx) * 4 + 3] > 100; x.fillStyle = on ? col : 'rgba(255,255,255,0.035)'; if (on) { x.shadowColor = col; x.shadowBlur = 6; } x.beginPath(); x.arc(40 + xx, Y + yy, 2.6, 0, 7); x.fill(); x.shadowBlur = 0; } };
  x.fillStyle = '#111'; rr(20, 260, 1040, 1300, 30); x.fill();
  led('RBI 04 DEC', 320, '#ef4444'); led('REPO 5.50%', 520, '#f59e0b'); led('CPI 6.09%', 720, '#f87171'); led('BNF 62000', 920, '#22c55e'); led('FED 09 DEC', 1120, '#60a5fa'); led('KYA HOGA?', 1320, '#facc15');
  label(21, 'LED Stock Board');
};
// 22 Magazine cover
S[22] = () => {
  cover(IMG.cinematic, 0.1);
  T('FJ', 540, 300, { size: 300, w: 900, c: '#ffffff', sh: 'rgba(0,0,0,0.5)' });
  T('FINANCE JUNCTION · DECEMBER 2026', 540, 470, { size: 32, w: 700, c: '#f4cf6a', ls: 6 });
  const g = x.createLinearGradient(0, 1100, 0, H); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.85)'); x.fillStyle = g; x.fillRect(0, 1100, W, H - 1100);
  T('THE', 80, 1310, { size: 60, w: 300, a: 'left' }); T('RATE GAME', 80, 1420, { size: 130, w: 900, a: 'left', c: '#f4cf6a' });
  T('RBI ka 4 Dec faisla aur record par Bank Nifty', 80, 1530, { size: 40, w: 600, a: 'left', c: '#fff', maxW: 900 });
  x.fillStyle = '#ef4444'; x.beginPath(); x.arc(900, 760, 110, 0, 7); x.fill(); T('CPI', 900, 730, { size: 40, w: 800 }); T('6.09%', 900, 790, { size: 54, w: 900 });
  label(22, 'Magazine Cover');
};
// 23 Split-flap airport board
S[23] = () => {

  const flap = (s, X, Y, n, col = '#f5f5f5') => { for (let i = 0; i < n; i++) { const ch = s[i] || ' '; x.fillStyle = '#1f1f1f'; rr(X + i * 52, Y, 46, 70, 6); x.fill(); x.fillStyle = '#000'; x.fillRect(X + i * 52, Y + 34, 46, 2); T(ch, X + i * 52 + 23, Y + 37, { size: 46, w: 800, c: col, f: '"JetBrains Mono"' }); } };

  rows.forEach(([d, e, s], i) => { const Y = 460 + i * 200; flap(d, 40, Y, 6); flap(e, 412, Y, 11); T(s, 990, Y + 130, { size: 30, w: 800, a: 'right', c: i === 1 ? '#22c55e' : '#facc15' }); });

};
// 24 Aurora gradient minimal
S[24] = () => {
  x.fillStyle = '#f8f7ff'; x.fillRect(0, 0, W, H);

  T('Markets wait.', 80, 760, { size: 130, w: 800, a: 'left', c: '#7c3aed' });

  card(80, 950, 'Repo', '5.50%', '#111827'); card(560, 950, 'CPI', '6.09%', '#e11d48'); card(80, 1210, 'Bank Nifty', '62,000', '#059669'); card(560, 1210, 'Fed', '9 Dec', '#2563eb');

};
window.draw = n => { x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, W, H); S[n](); };
window.ready = (async () => {
  const [logo, cinematic, clay, flat] = await Promise.all(['../brand/logo-transparent.png', 'img/cinematic.png', 'img/clay.png', 'img/flat.png'].map(L));
  IMG = { logo, cinematic, clay, flat };
  await Promise.all(['900', '800', '700', '600', '500', '300'].map(w => document.fonts.load(`${w} 40px Inter`)));
  await document.fonts.load('800 40px "JetBrains Mono"'); await document.fonts.load('40px "Noto Color Emoji"', '📝🚀😱📺🏦');

</script></body></html>
