const W = 1080, H = 1920, c = document.getElementById('c'), x = c.getContext('2d');
const F = (w, s, f = 'Inter') => `${w} ${s}px ${f}, "Noto Color Emoji", sans-serif`;
const L = s => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = s; });
let IMG = {};
function rr(X, Y, w, h, r) { r = Math.min(r, w / 2, h / 2); x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r); x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath(); }
function T(s, X, Y, o = {}) {
  const { size = 60, w = 800, c: col = '#fff', a = 'center', maxW = 1000, f = 'Inter', sh = 0, stroke = null, rot = 0, ls = 0 } = o;
  x.save(); x.font = F(w, size, f); if (ls) x.letterSpacing = ls + 'px';
  let k = 1; const mw = x.measureText(s).width; if (mw > maxW) k = maxW / mw;
  x.translate(X, Y); x.rotate(rot); x.scale(k, k); x.textAlign = a; x.textBaseline = 'middle';
  if (sh) { x.shadowColor = typeof sh === 'string' ? sh : 'rgba(0,0,0,0.6)'; x.shadowBlur = 30; }
  if (stroke) { x.lineWidth = stroke[1]; x.strokeStyle = stroke[0]; x.strokeText(s, 0, 0); }
  if (col) { x.fillStyle = col; x.fillText(s, 0, 0); }
  x.restore();
}
function cover(img, dim = 0) { const s = Math.max(W / img.width, H / img.height); const w = img.width * s, h = img.height * s; x.drawImage(img, (W - w) / 2, (H - h) / 2, w, h); if (dim) { x.fillStyle = `rgba(0,0,0,${dim})`; x.fillRect(0, 0, W, H); } }
function badge(dark = true) {
  x.save(); rr(48, 56, 96, 96, 22); x.fillStyle = '#fff'; x.fill(); x.drawImage(IMG.logo, 250, 75, 755, 755, 58, 66, 76, 76); x.restore();
  T('FINANCE JUNCTION', 166, 104, { size: 30, w: 900, a: 'left', c: dark ? '#f8fafc' : '#0b2545', ls: 2 });
}
function label(n, name) { // style tag at bottom
  x.fillStyle = 'rgba(0,0,0,0.75)'; rr(40, 1790, 1000, 90, 20); x.fill();
  T(`STYLE ${n}`, 80, 1835, { size: 34, w: 900, a: 'left', c: '#f4cf6a' });
  T(name, 1040 - 30, 1835, { size: 38, w: 800, a: 'right', c: '#fff', maxW: 720 });
}
function chip(s, X, Y, bg, fg = '#0b1020', size = 38) {
  x.font = F(800, size); const w = x.measureText(s).width + 56; rr(X - w / 2, Y - size * 0.85, w, size * 1.7, size * 0.85); x.fillStyle = bg; x.fill(); T(s, X, Y + 2, { size, w: 800, c: fg });
}
