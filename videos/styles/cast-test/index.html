<!doctype html><html><head><meta charset="utf-8"><title>Cast</title><style>html,body{margin:0;background:#000}</style></head>
<body><script type="module">
import { CAST, drawPerson } from '/engine/cast.js';
const W = 1620, H = 2160; // 4 cols x 3 rows
const out = document.createElement('canvas'); out.width = W; out.height = H; out.id = 'out'; document.body.appendChild(out);
const c = out.getContext('2d');
await Promise.all(['900','700','600'].map(w => document.fonts.load(`${w} 40px Inter`))); await document.fonts.load('40px "Noto Color Emoji"', '👍⚠️₹');
const d13 = false;
const keys = Object.keys(CAST);
const moods = ['talk','happy','talk','worried','talk','thumbs','point','talk','think','happy','happy','talk'];
window.DUR = 4;
window.renderFrame = t => {
  const g = c.createLinearGradient(0,0,0,H); g.addColorStop(0,'#fdf6ec'); g.addColorStop(1,'#efe4d2'); c.fillStyle = g; c.fillRect(0,0,W,H);
  keys.forEach((k, i) => {
    const col = i % 4, row = Math.floor(i / 4), cx = 202 + col * 405, by = 610 + row * 720;
    c.fillStyle = 'rgba(255,255,255,0.7)'; c.beginPath(); c.roundRect(cx - 190, by - 560, 380, 690, 30); c.fill();
    drawPerson(c, t + i * 0.37, cx, by, CAST[k].kid ? 0.78 : 0.95, CAST[k], moods[i], 0.25 + 0.25 * Math.sin(t * 9 + i), false);
    c.textAlign = 'center'; c.fillStyle = '#0b2545'; c.font = '900 40px Inter'; { const lbl = `${i + (d13 ? 13 : 1)}. ${CAST[k].name}`; const m = c.measureText(lbl).width; if (m > 360) c.font = `900 ${Math.floor(40 * 360 / m)}px Inter`; } c.fillText(`${i + 1}. ${CAST[k].name}`, cx, by + 56);
    c.fillStyle = '#6b7280'; c.font = '600 28px Inter'; c.fillText(CAST[k].role, cx, by + 98);
  });
};
renderFrame(0); window.READY = true;
</script></body></html>
