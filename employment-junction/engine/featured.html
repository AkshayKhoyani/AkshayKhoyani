<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0}
:root{--a:#ffd60a;--b:#ff3d3d;--bg1:#0a2a7a;--bg2:#06123a;--ray:rgba(255,214,10,.16)}
body{width:1536px;height:1024px;overflow:hidden;position:relative;font-family:Inter,sans-serif;color:#fff;background:radial-gradient(900px 700px at 78% 52%,rgba(255,255,255,.16),transparent 60%),linear-gradient(135deg,var(--bg1),var(--bg2))}
.rays{position:absolute;right:-260px;top:-180px;width:1400px;height:1400px;border-radius:50%;background:repeating-conic-gradient(var(--ray) 0 7deg,transparent 7deg 15deg);mask-image:radial-gradient(circle,#000 0 34%,transparent 62%);-webkit-mask-image:radial-gradient(circle,#000 0 34%,transparent 62%)}
.dots{position:absolute;left:0;bottom:0;width:760px;height:520px;background-image:radial-gradient(rgba(255,255,255,.12) 2.2px,transparent 2.6px);background-size:22px 22px;mask-image:linear-gradient(20deg,#000,transparent 70%);-webkit-mask-image:linear-gradient(20deg,#000,transparent 70%)}
.slash{position:absolute;left:-120px;top:0;width:220px;height:1100px;background:var(--a);transform:rotate(14deg);opacity:.95;box-shadow:0 0 60px rgba(0,0,0,.3)}
.slash2{position:absolute;left:120px;top:0;width:26px;height:1100px;background:var(--b);transform:rotate(14deg)}
.char{position:absolute;right:10px;bottom:0;height:990px;filter:drop-shadow(0 0 0 #fff) drop-shadow(6px 0 0 #fff) drop-shadow(-6px 0 0 #fff) drop-shadow(0 -6px 0 #fff) drop-shadow(0 30px 40px rgba(0,0,0,.55))}
.top{position:absolute;left:200px;top:28px;display:flex;align-items:center;gap:16px}
.logo{background:#fff;border-radius:18px;padding:10px 18px;border:4px solid var(--a);box-shadow:0 10px 26px rgba(0,0,0,.4);display:flex;align-items:center}.logo img{height:84px;width:auto;display:block}
.sticker{position:absolute;right:56px;top:40px;transform:rotate(6deg);background:var(--b);color:#fff;font:900 34px Inter;padding:14px 28px;border-radius:16px;border:5px solid #fff;box-shadow:0 12px 28px rgba(0,0,0,.4);letter-spacing:1px}
.sticker small{display:block;font:800 18px Inter;color:var(--a);letter-spacing:2px}
.main{position:absolute;left:200px;top:178px;width:640px}
.cat{display:inline-block;background:var(--a);color:#0a0a0a;font:900 30px Inter;padding:10px 24px;border-radius:12px;transform:skewX(-8deg);box-shadow:6px 6px 0 rgba(0,0,0,.35);letter-spacing:.5px}
.org{font:800 32px Inter;color:#dbeafe;margin:24px 0 10px;text-shadow:0 2px 0 rgba(0,0,0,.4)}
h1{font:900 74px/1.02 Inter;letter-spacing:-1px;text-transform:uppercase;text-shadow:0 5px 0 rgba(0,0,0,.45),0 0 30px rgba(0,0,0,.35)}
h1 em{font-style:normal;color:var(--a)}
.burst{position:absolute;left:870px;top:340px;width:250px;height:250px;z-index:3;display:grid;place-items:center;text-align:center;color:#0a0a0a;background:var(--a);clip-path:polygon(50% 0,61% 13%,77% 6%,80% 23%,96% 27%,89% 42%,100% 55%,87% 64%,91% 81%,74% 82%,67% 98%,52% 88%,36% 98%,30% 82%,12% 84%,15% 66%,0 57%,10% 43%,3% 27%,19% 22%,22% 5%,38% 12%);filter:drop-shadow(0 10px 20px rgba(0,0,0,.4))}
.burst b{display:block;font:900 58px/1 Inter;letter-spacing:-2px}.burst span{font:900 26px Inter;letter-spacing:2px}
.chips{position:absolute;left:200px;top:810px;display:flex;gap:14px}
.chip{background:#fff;color:#0f172a;border-radius:14px;padding:12px 20px;box-shadow:0 8px 18px rgba(0,0,0,.35);min-width:180px}
.chip small{display:block;font:800 17px Inter;color:#64748b;text-transform:uppercase;letter-spacing:1px}
.chip b{font:900 32px Inter}
.chip.hot{background:var(--b);color:#fff}.chip.hot small{color:#ffe4e6}
.apply{position:absolute;left:200px;top:700px;display:inline-flex;align-items:center;gap:12px;background:linear-gradient(180deg,#22c55e,#15803d);color:#fff;font:900 34px Inter;padding:16px 30px;border-radius:999px;border:4px solid #fff;box-shadow:0 10px 24px rgba(0,0,0,.4)}
.foot{position:absolute;left:0;right:0;bottom:0;height:62px;background:#0a0a0a;display:flex;align-items:center;justify-content:space-between;padding:0 40px 0 200px}
.foot span{font:800 26px Inter;color:#fff}.foot span b{color:var(--a)}
.mock{background:linear-gradient(90deg,#ff4d6d,#7c3aed);color:#fff;font:900 24px Inter;padding:8px 18px;border-radius:999px}
.tri{position:absolute;left:0;right:0;bottom:62px;height:10px;background:linear-gradient(90deg,#ff9933 0 33.3%,#fff 33.3% 66.6%,#138808 66.6%)}
</style></head>
<body>
<div class="rays"></div><div class="dots"></div><div class="slash"></div><div class="slash2"></div>
<img class="char" id="char" alt="">
<div class="top"><div class="logo"><img id="logo" alt="Employment Junction"></div></div>
<div class="sticker" id="sticker"></div>
<div class="main"><div class="cat" id="tag"></div><div class="org" id="org"></div><h1 id="h"></h1></div>
<div class="burst" id="burst"><div><b id="bn"></b><span id="bl"></span></div></div>
<div class="apply" id="apply"></div>
<div class="chips" id="chips"></div>
<div class="tri"></div>
<div class="foot"><span>🌐 <b>employmentjunction.in</b> · Sarkari Naukri ki har khabar</span><span class="mock" id="mock">🎯 FREE MOCK TEST</span></div>
<script>
const D = __DATA__;
const T = {gold:['#ffd60a','#ff3d3d','#0a2a7a','#06123a','rgba(255,214,10,.16)'],green:['#ffd60a','#e11d48','#065f46','#022c22','rgba(255,214,10,.14)'],
  sky:['#ffd60a','#ff3d3d','#0c4a8a','#041a3a','rgba(125,211,252,.18)'],rose:['#ffd60a','#be123c','#7f1d3a','#2a0a16','rgba(255,214,10,.14)'],
  violet:['#ffd60a','#ff3d3d','#4c1d95','#1e0a3c','rgba(255,214,10,.14)'],red:['#ffd60a','#1d4ed8','#9f1239','#3b0716','rgba(255,214,10,.16)']}[D.theme || 'gold'];
const R = document.documentElement.style; ['--a','--b','--bg1','--bg2','--ray'].forEach((k,i)=>R.setProperty(k,T[i]));
const $ = id => document.getElementById(id);
$('tag').textContent = D.tag; $('org').textContent = D.org; $('h').innerHTML = D.headline;
$('sticker').innerHTML = (D.sticker || 'NEW VACANCY') + '<small>' + (D.sticker_sub || '2026 · APPLY ONLINE') + '</small>';
if (D.big) { $('bn').textContent = D.big; $('bl').textContent = D.big_label || 'POSTS'; } else $('burst').style.display = 'none';
$('apply').textContent = (D.cta || 'APPLY NOW') + ' ▶';
$('chips').innerHTML = (D.chips || []).slice(0, 3).map(([k, v, hot]) => `<div class="chip${hot ? ' hot' : ''}"><small>${k}</small><b>${v}</b></div>`).join('');
$('char').src = D.character_src; $('logo').src = D.logo_src;
if (!D.mock) $('mock').style.display = 'none';
// auto-shrink the headline so it never runs into the burst/character
const h = $('h'); let fs = 74; while ((h.scrollWidth > 640 || h.offsetHeight > 300) && fs > 42) { fs -= 2; h.style.fontSize = fs + 'px'; }
</script>
</body></html>
