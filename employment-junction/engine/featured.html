<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0}
body{width:1536px;height:1024px;font-family:Inter,sans-serif;color:#f8fafc;overflow:hidden;
 background:radial-gradient(circle at 15% 20%,rgba(59,130,246,.35),transparent 45%),radial-gradient(circle at 90% 85%,rgba(255,153,51,.25),transparent 45%),linear-gradient(160deg,#0a2352,#071a3d 60%,#030b1c)}
.top{display:flex;align-items:center;gap:22px;padding:56px 72px 0}
.logo{width:96px;height:96px;border-radius:24px;background:linear-gradient(135deg,#1554c0,#0b3d91);border:4px solid #ffb703;display:grid;place-items:center;font:900 44px Inter;color:#ffb703}
.brand b{display:block;font:900 34px Inter;letter-spacing:.5px}.brand span{color:#ffb703;font:900 34px Inter}
.tag{margin-left:auto;background:#ffb703;color:#071a3d;font:800 30px Inter;padding:14px 30px;border-radius:999px}
.main{padding:70px 72px 0}
.org{font:700 42px Inter;color:#7dd3fc;margin-bottom:18px}
h1{font:900 92px/1.05 Inter;max-width:1300px}
h1 em{font-style:normal;color:#ffb703}
.chips{display:flex;gap:22px;margin-top:56px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.16);border-radius:24px;padding:22px 30px}
.chip small{display:block;font:600 24px Inter;color:#9fb3d1;text-transform:uppercase;letter-spacing:1px}
.chip b{font:900 44px Inter}
.chip.hot{border-color:#ef4444;background:rgba(239,68,68,.14)}
.bar{position:absolute;bottom:0;left:0;right:0;height:18px;background:linear-gradient(90deg,#ff9933 0 33.3%,#fff 33.3% 66.6%,#138808 66.6%)}
.site{position:absolute;bottom:44px;right:72px;font:700 30px Inter;color:#9fb3d1}
</style></head>
<body>
<div class="top"><div class="logo">EJ</div><div class="brand"><b>EMPLOYMENT</b><span>JUNCTION</span></div><div class="tag" id="tag"></div></div>
<div class="main"><div class="org" id="org"></div><h1 id="h"></h1><div class="chips" id="chips"></div></div>
<div class="site">employmentjunction.in</div><div class="bar"></div>
<script>
const D = __DATA__;
document.getElementById('tag').textContent = D.tag;
document.getElementById('org').textContent = D.org;
document.getElementById('h').innerHTML = D.headline;
document.getElementById('chips').innerHTML = D.chips.map(([k, v, hot]) => `<div class="chip${hot ? ' hot' : ''}"><small>${k}</small><b>${v}</b></div>`).join('');
</script>
</body></html>
