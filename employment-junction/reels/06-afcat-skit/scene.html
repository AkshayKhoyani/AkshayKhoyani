<!doctype html>
<html><head><meta charset="utf-8"><title>AFCAT 01/2027 – skit reel</title>
<style>html,body{margin:0;background:#071a3d}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../brand/ej.js"></script>
<script>
// Facts (employmentjunction.in post + official AFCAT 01/2027 notification): 284 posts (Flying, Ground Duty Tech/Non-Tech);
// Pay Level 10 ₹56,100–1,77,500; age Flying 20–24, Ground Duty 20–26 (as on 01.01.2028); Flying needs Physics+Maths at 10+2;
// fee ₹550 + GST; exam 31 Jan 2027; last date 11 Dec 2026.
// Skit format: hook in the first second, 2 characters on screen, the speaker talks, the other reacts. Live clay 3D backdrops.
const { C, txt, pop, pill, words, card, counter, check, stamp, person, bubble, commentCTA, endCard } = EJ;
const L = 330, R = 760, Y = 1880, S = 1.6;
window.SCENES = [
  // 1 HOOK – shock line + big salary number in the first second
  { theme: 'clay_home', dur: 3.2, design: 3.2, draw(t) {
    stamp(t, 0.05, '₹56,100', 540, 330, '#e11d48', -0.06, 150);
    words(t, 0.5, 'सिर्फ Graduation पे?! ✈️', 520, { size: 70 });
    person(t, 'mummy_ji', 0, R, Y, S, { flip: true, moods: [[0, 9, 'think']] });
    person(t, 'student', 0, L, Y, S, { talk: [[0, 3.2]], moods: [[0, 3.2, 'shock']] });
  }},
  // 2 doubt – mummy laughs it off
  { theme: 'clay_home', dur: 3.6, design: 3.6, draw(t) {
    bubble(t, 0.2, 'Badi sifarish lagti hai! 🙄', 600, 560, { size: 52, tail: 'right' });
    person(t, 'student', 0, L, Y, S, { moods: [[0, 9, 'worried']] });
    person(t, 'mummy_ji', 0, R, Y, S, { flip: true, talk: [[0, 3.6]], moods: [[0.2, 2.2, 'happy']] });
  }},
  // 3 the officer answers – the job
  { theme: 'clay_army_camp', dur: 5.2, design: 5.2, draw(t) {
    pill(t, 0.1, '🇮🇳 INDIAN AIR FORCE', 270, C.gold);
    words(t, 0.4, 'AFCAT 01/2027', 400, { size: 90 });
    counter(t, 0.9, 1.3, 284, 540, 590, { size: 170 });
    txt('OFFICER POSTS', 540, 670, { size: 50, weight: 900, color: C.gold, alpha: Math.min(1, Math.max(0, t - 1.2)) });
    pop(t, 2.8, 'Flying · Ground Duty (Tech / Non-Tech)', 540, 760, { size: 40, weight: 700 });
    person(t, 'airforce', 0, 540, Y, 1.85, { talk: [[0, 5.2]], moods: [[0.1, 1.4, 'wave']] });
  }},
  // 4 eligibility
  { theme: 'clay_classroom', dur: 6.0, design: 6.0, draw(t) {
    pill(t, 0.1, '🎓 KAUN APPLY KAR SAKTA HAI?', 270, C.sky);
    card(t, 0.3, 70, 350, 450, 240, { accent: C.gold, draw: (x, y) => { txt('Age', x + 225, y + 85, { size: 44, color: C.muted }); txt('20 – 26 saal', x + 225, y + 175, { size: 54, color: C.gold }); } });
    card(t, 1.6, 560, 350, 450, 240, { accent: C.sky, draw: (x, y) => { txt('Flying', x + 225, y + 85, { size: 44, color: C.muted }); txt('20 – 24 saal', x + 225, y + 175, { size: 54, color: C.sky }); } });
    card(t, 3.0, 110, 630, 860, 130, { draw: (x, y) => txt('Graduation · Flying: 12th mein Physics + Maths', x + 430, y + 82, { size: 40 }) });
    person(t, 'exam_didi', 0, 540, Y, 1.85, { talk: [[0, 6.0]], moods: [[2.8, 4.4, 'point']] });
  }},
  // 5 fee + dates – urgency
  { theme: 'clay_exam_hall', dur: 5.6, design: 5.6, draw(t) {
    pill(t, 0.1, '⚡ FEE & DATES', 270, C.gold);
    card(t, 0.3, 70, 350, 940, 400, { draw: (x, y) => {
      check(t, 0.6, x + 80, y + 90, 'Fee: ₹550 + GST', { size: 46 });
      check(t, 1.8, x + 80, y + 200, 'Exam: 31 Jan 2027', { size: 46 });
      check(t, 3.2, x + 80, y + 310, 'Last Date: 11 Dec 2026', { size: 46, color: '#fda4af' }); } });
    stamp(t, 3.6, 'JALDI!', 820, 800, '#e11d48', -0.12, 84);
    person(t, 'anchor_rohan', 0, 540, Y, 1.85, { talk: [[0, 5.6]] });
  }},
  // 6 mummy flips
  { theme: 'clay_home', dur: 2.4, design: 2.4, draw(t) {
    bubble(t, 0.1, 'Toh baitha kyun hai?! 😤', 600, 560, { size: 56, tail: 'right' });
    person(t, 'student', 0, L, Y, S, { moods: [[0, 9, 'shock']] });
    person(t, 'mummy_ji', 0, R, Y, S, { flip: true, talk: [[0, 2.4]], moods: [[0, 2.4, 'point']] });
  }},
  // 7 CTA + end card
  { theme: 'clay_street', dur: 6.2, design: 6.2, noWatermark: true, draw(t) {
    if (t < 4.6) { commentCTA(t, 0.05, 'AFCAT', 300); person(t, 'student', 0.1, 540, Y, 1.85, { talk: [[0, 4.5]], moods: [[2.6, 4.6, 'thumbs']] }); }
    else endCard(t, 4.6);
  }}
];
EJ.start();
</script></body></html>
