<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body>
<script src="three.min.js"></script>
<script>
// Code-built 3D backgrounds for reels (Three.js). Usage: scenes.html?scene=<key>  -> renders a 1080x1920 frame.
// Keys: news_studio, exam_hall, stage, city_night, study_desk
const W = 1080, H = 1920;
const R = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
R.setSize(W, H); R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 1.1; R.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(R.domElement);
const S = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(42, W / H, 0.1, 400);
const std = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: o.r ?? 0.6, metalness: o.m ?? 0.05, emissive: o.e || 0x000000, emissiveIntensity: o.ei ?? 1 });
const box = (w, h, d, mat, x, y, z, shadow = true) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); m.castShadow = shadow; m.receiveShadow = true; S.add(m); return m; };
const cyl = (r1, r2, h, mat, x, y, z, seg = 48) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, h, seg), mat); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; S.add(m); return m; };
const spot = (col, int, x, y, z, tx, ty, tz, ang = 0.5) => { const l = new THREE.SpotLight(col, int, 0, ang, 0.5, 1.2); l.position.set(x, y, z); l.target.position.set(tx, ty, tz); l.castShadow = true; l.shadow.mapSize.set(1024, 1024); S.add(l); S.add(l.target); return l; };
const rnd = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
function textTex(txt, w, h, bg, fg, font) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
  x.fillStyle = bg; x.fillRect(0, 0, w, h); x.fillStyle = fg; x.font = font; x.textAlign = 'center'; x.textBaseline = 'middle';
  txt.split('\n').forEach((l, i, a) => x.fillText(l, w / 2, h / 2 + (i - (a.length - 1) / 2) * parseInt(font.match(/(\d+)px/)[1]) * 1.2));
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

const SCENES = {
  news_studio() {
    S.background = new THREE.Color(0x05070f); S.fog = new THREE.Fog(0x05070f, 30, 90);
    box(80, 0.2, 80, std(0x0b1220, { r: 0.25, m: 0.6 }), 0, -0.1, 0);
    // LED wall
    for (let i = -3; i <= 3; i++) for (let j = 0; j < 4; j++) {
      const c = new THREE.Color().setHSL(0.6 + rnd() * 0.05, 0.8, 0.25 + rnd() * 0.25);
      box(3.9, 2.9, 0.2, std(0x000000, { e: c, ei: 1.2 }), i * 4, 1.6 + j * 3, -18, false);
    }
    box(8, 2.6, 0.3, new THREE.MeshBasicMaterial({ map: textTex('BREAKING\nNEWS', 800, 260, '#b91c1c', '#fff', '900 110px sans-serif') }), 0, 8, -17.7, false);
    // anchor desk
    const desk = std(0x1e293b, { r: 0.3, m: 0.5 }); box(10, 2.2, 3, desk, 0, 1.1, -6); box(10.4, 0.25, 3.4, std(0xe2e8f0, { r: 0.2, m: 0.3 }), 0, 2.3, -6);
    box(10, 0.3, 0.1, std(0x000000, { e: 0xdc2626, ei: 2 }), 0, 1.6, -4.45, false);
    // light strips + beams
    for (let i = -2; i <= 2; i++) box(0.15, 14, 0.15, std(0x000000, { e: i % 2 ? 0x2563eb : 0xdc2626, ei: 2.5 }), i * 7, 7, -16, false);
    S.add(new THREE.AmbientLight(0x6070a0, 0.35));
    spot(0xffffff, 900, 0, 18, 8, 0, 1, -6, 0.45); spot(0x3b82f6, 500, -14, 16, -2, -4, 0, -10, 0.5); spot(0xef4444, 500, 14, 16, -2, 4, 0, -10, 0.5);
    cam.position.set(0, 6.5, 26); cam.lookAt(0, 7, -12);
  },
  exam_hall() {
    S.background = new THREE.Color(0xe9dcc4); S.fog = new THREE.Fog(0xe9dcc4, 25, 70);
    box(60, 0.2, 80, std(0xc8a27a, { r: 0.7 }), 0, -0.1, -10);
    box(60, 20, 0.5, std(0xf1e6d2), 0, 10, -40, false);
    box(14, 6, 0.3, std(0x1f3b2d, { r: 0.9 }), 0, 7, -39.6, false);
    box(13, 5, 0.31, new THREE.MeshBasicMaterial({ map: textTex('EXAM 2026\nAll the best!', 900, 340, '#1f3b2d', '#f8fafc', '700 120px sans-serif') }), 0, 7, -39.4, false);
    const clock = cyl(1.3, 1.3, 0.2, std(0xffffff), 12, 11, -39.6); clock.rotation.x = Math.PI / 2;
    const wood = std(0x8b5a2b, { r: 0.55 }), paper = std(0xfafafa, { r: 0.9 });
    for (let r = 0; r < 6; r++) for (let c = -3; c <= 3; c++) {
      const x = c * 4.2, z = -6 - r * 5;
      box(2.6, 0.15, 1.6, wood, x, 2.2, z); [-1.1, 1.1].forEach(dx => box(0.12, 2.2, 1.4, wood, x + dx, 1.1, z));
      box(1.0, 0.02, 1.3, paper, x + 0.3, 2.29, z, false);
      box(1.8, 0.12, 1.4, std(0x5b3a1d), x, 1.3, z + 1.6); box(1.8, 1.6, 0.12, std(0x5b3a1d), x, 2.1, z + 2.3);
    }
    S.add(new THREE.HemisphereLight(0xfff4e0, 0x8a6a4a, 1.1));
    const sun = new THREE.DirectionalLight(0xffe2b0, 2.2); sun.position.set(-20, 30, 10); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
    Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40 }); S.add(sun);
    cam.position.set(0, 9, 12); cam.lookAt(0, 4, -20);
  },
  stage() {
    S.background = new THREE.Color(0x0a0618); S.fog = new THREE.Fog(0x0a0618, 20, 70);
    box(100, 0.2, 100, std(0x120a24, { r: 0.3, m: 0.4 }), 0, -0.1, 0);
    for (let i = 0; i < 3; i++) { const g = cyl(9 - i * 2.2, 9.4 - i * 2.2, 0.6, std(0x1e1b4b, { r: 0.3, m: 0.6 }), 0, 0.3 + i * 0.6, -6); }
    [9.3, 7.1, 4.9].forEach((r, i) => { const ring = new THREE.Mesh(new THREE.TorusGeometry(r, 0.07, 8, 96), std(0x000000, { e: 0xfbbf24, ei: 3 })); ring.rotation.x = Math.PI / 2; ring.position.set(0, 0.62 + i * 0.6, -6); S.add(ring); });
    for (let i = 0; i < 6; i++) { // light beams
      const beam = new THREE.Mesh(new THREE.ConeGeometry(2.5, 26, 32, 1, true), new THREE.MeshBasicMaterial({ color: i % 2 ? 0xa78bfa : 0xfbbf24, transparent: true, opacity: 0.07, side: THREE.DoubleSide, depthWrite: false }));
      beam.position.set(-15 + i * 6, 13, -14); beam.rotation.z = (i - 2.5) * 0.12; S.add(beam);
    }
    for (let i = 0; i < 160; i++) { const p = new THREE.Mesh(new THREE.SphereGeometry(0.06 + rnd() * 0.08, 8, 8), new THREE.MeshBasicMaterial({ color: 0xfde68a })); p.position.set((rnd() - 0.5) * 40, rnd() * 26, -10 - rnd() * 20); S.add(p); }
    S.add(new THREE.AmbientLight(0x8070c0, 0.4)); spot(0xffffff, 1200, 0, 22, 4, 0, 1, -6, 0.35); spot(0xa78bfa, 600, -16, 18, 0, -4, 0, -8); spot(0xfbbf24, 600, 16, 18, 0, 4, 0, -8);
    cam.position.set(0, 7, 18); cam.lookAt(0, 6, -8);
  },
  city_night() {
    const g = document.createElement('canvas'); g.width = 2; g.height = 512; const gx = g.getContext('2d'); const gr = gx.createLinearGradient(0, 0, 0, 512);
    gr.addColorStop(0, '#0b1a4a'); gr.addColorStop(0.6, '#3b1d6e'); gr.addColorStop(1, '#f97316'); gx.fillStyle = gr; gx.fillRect(0, 0, 2, 512);
    const sky = new THREE.CanvasTexture(g); sky.colorSpace = THREE.SRGBColorSpace; S.background = sky; S.fog = new THREE.Fog(0x3b1d6e, 40, 160);
    box(400, 0.2, 400, std(0x0f172a, { r: 0.2, m: 0.6 }), 0, -0.1, 0);
    const winTex = (() => { const c = document.createElement('canvas'); c.width = 64; c.height = 128; const x = c.getContext('2d'); x.fillStyle = '#0b1020'; x.fillRect(0, 0, 64, 128);
      for (let yy = 4; yy < 128; yy += 10) for (let xx = 4; xx < 64; xx += 10) if (Math.random() < 0.55) { x.fillStyle = Math.random() < 0.7 ? '#fde68a' : '#93c5fd'; x.fillRect(xx, yy, 5, 6); }
      const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; return t; })();
    for (let i = 0; i < 140; i++) {
      const w = 3 + rnd() * 5, h = 6 + rnd() * 40, x = (rnd() - 0.5) * 120, z = -20 - rnd() * 110; if (Math.abs(x) < 7 && z > -40) continue;
      const tex = winTex.clone(); tex.needsUpdate = true; tex.repeat.set(w / 4, h / 8);
      box(w, h, w, new THREE.MeshStandardMaterial({ color: 0x1e293b, emissive: 0xffffff, emissiveMap: tex, emissiveIntensity: 0.9, roughness: 0.6 }), x, h / 2, z);
    }
    S.add(new THREE.HemisphereLight(0x8090ff, 0x301030, 0.6)); const moon = new THREE.DirectionalLight(0xffc9a0, 1.2); moon.position.set(30, 20, -60); S.add(moon);
    cam.position.set(0, 1.2, 14); cam.lookAt(0, 22, -60);
    for (let i = 0; i < 40; i++) box(0.25, 0.02, 2.2, std(0x000000, { e: 0xfbbf24, ei: 2 }), 0, 0.02, 10 - i * 5, false);
  },
  study_desk() {
    S.background = new THREE.Color(0x141022); S.fog = new THREE.Fog(0x141022, 18, 45);
    box(40, 0.2, 40, std(0x3a2a1e, { r: 0.6 }), 0, -0.1, 0); box(40, 24, 0.4, std(0x2a2440), 0, 12, -10, false);
    // window with night city
    box(10, 8, 0.3, new THREE.MeshBasicMaterial({ map: textTex('', 10, 8, '#1e3a8a', '#fff', '10px sans-serif') }), 6, 12, -9.7, false);
    for (let i = 0; i < 40; i++) box(0.15, 0.2, 0.05, std(0x000000, { e: 0xfde68a, ei: 2 }), 2 + rnd() * 8, 8.5 + rnd() * 6, -9.5, false);
    const wood = std(0x7c4a21, { r: 0.45 }); box(14, 0.4, 5, wood, -2, 6, -6); [-8.5, 4.5].forEach(x => box(0.4, 6, 4.6, wood, x, 3, -6));
    // books
    const cols = [0xdc2626, 0x2563eb, 0x16a34a, 0xf59e0b, 0x7c3aed];
    for (let i = 0; i < 5; i++) box(2.6, 0.45, 1.8, std(cols[i]), -6 + rnd() * 0.3, 6.45 + i * 0.46, -6.5);
    for (let i = 0; i < 6; i++) { const b = box(0.4, 2.4 + rnd(), 1.6, std(cols[i % 5]), 1.2 + i * 0.45, 7.4, -7.6); b.rotation.z = i === 5 ? -0.25 : 0; }
    // laptop
    box(3.2, 0.12, 2.2, std(0x94a3b8, { m: 0.7, r: 0.3 }), -1.5, 6.27, -5.6); const scr = box(3.2, 2.1, 0.08, std(0x000000, { e: 0x60a5fa, ei: 1.4 }), -1.5, 7.3, -6.7); scr.rotation.x = -0.15;
    // lamp
    cyl(0.6, 0.8, 0.2, std(0x1f2937, { m: 0.6 }), 3.8, 6.3, -5.6); cyl(0.08, 0.08, 3, std(0x1f2937, { m: 0.6 }), 3.8, 7.8, -5.6);
    const shade = cyl(0.4, 1.1, 1, std(0xf59e0b, { e: 0xf59e0b, ei: 0.4 }), 3.4, 9.4, -5.6); shade.rotation.z = 0.5;
    const pl = new THREE.PointLight(0xffd59a, 120, 18); pl.position.set(3.0, 8.8, -5.4); pl.castShadow = true; S.add(pl);
    S.add(new THREE.AmbientLight(0x6060a0, 0.35));
    cam.position.set(0, 10.5, 19); cam.lookAt(0, 8.5, -8);
  },
};
const key = new URLSearchParams(location.search).get('scene') || 'news_studio';
SCENES[key](); R.render(S, cam); window.done = true;
</script></body></html>
