<!doctype html>
<html><head><meta charset="utf-8"><title>DSSSB – cast sample reel</title>
<style>html,body{margin:0;background:#071a3d}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../brand/ej.js"></script>
<script>
// Facts (official DSSSB Advt 06/2026): 1,260 posts = 1,075 MTS + 185 JE (Electrical); MTS 10th pass; JE diploma/degree;
// age 18–27; fee ₹100 (Gen/OBC/EWS), nil for women/SC/ST/PwBD/ESM; last date 11 Dec 2026.
const { C, txt, pill, words, card, counter, check, cast, bubble, commentCTA, endCard } = EJ;
window.SCENES = [
  { theme: 'scene_park', dur: 6.5, design: 6.5, draw(t) {
    pill(t, 0.1, '🏛️ DELHI GOVT JOB 2026', 290, C.gold);
    words(t, 0.4, 'DSSSB Recruitment', 420, { size: 86 });
    counter(t, 0.9, 1.4, 1260, 540, 600, { size: 170 });
    txt('POSTS', 540, 680, { size: 50, weight: 900, color: C.gold, alpha: Math.min(1, Math.max(0, t - 1.2)) });
    cast(t, 'naukri_bhaiya', 0.2, 540, 1880, 1150, { talk: [[0.2, 6.4]], pose: [[0.3, 1.6, 'wave']] });
  }},
  { theme: 'scene_tuition', dur: 8.5, design: 8.5, draw(t) {
    pill(t, 0.1, '🎓 ELIGIBILITY', 290, C.sky);
    card(t, 0.4, 70, 360, 450, 260, { accent: C.gold, draw: (x, y) => { txt('MTS · 1,075', x + 230, y + 90, { size: 48 }); txt('10th Pass', x + 230, y + 180, { size: 54, color: C.gold }); } });
    card(t, 1.6, 560, 360, 450, 260, { accent: C.sky, draw: (x, y) => { txt('JE (Elect.) · 185', x + 225, y + 90, { size: 44 }); txt('Diploma / Degree', x + 225, y + 180, { size: 44, color: C.sky }); } });
    card(t, 4.2, 240, 660, 600, 130, { draw: (x, y) => txt('Age: 18 – 27 saal', x + 300, y + 85, { size: 52 }) });
    cast(t, 'exam_didi', 0.1, 540, 1880, 1080, { talk: [[0.1, 8.4]], pose: [[3.6, 5.0, 'explain']] });
  }},
  { theme: 'scene_news_studio', dur: 8, design: 8, draw(t) {
    pill(t, 0.1, '⚡ FEE & LAST DATE', 290, C.gold);
    card(t, 0.4, 70, 360, 940, 400, { draw: (x, y) => {
      check(t, 0.8, x + 80, y + 90, 'Fee: ₹100 (Gen/OBC/EWS)', { size: 44 });
      check(t, 2.0, x + 80, y + 200, 'Women, SC, ST: FREE', { size: 44 });
      check(t, 3.6, x + 80, y + 310, 'Last Date: 11 Dec 2026', { size: 44 }); } });
    cast(t, 'junction_bot', 0.1, 540, 1860, 900, { talk: [[0.1, 7.9]], pose: [[5.2, 6.6, 'point']] });
  }},
  { theme: 'scene_home', dur: 4.5, design: 4.5, draw(t) {
    cast(t, 'result_chacha', 0.1, 560, 1880, 1250, { talk: [[0.1, 4.3]], pose: [[3.0, 4.5, 'thumbs']] });
    bubble(t, 0.4, 'Aaj hi form bharo, beta!', 540, 520, { size: 50 });
  }},
  { theme: 'scene_office', dur: 6.5, design: 6.5, noWatermark: true, draw(t, p, T, d) {
    if (t < 4.6) { commentCTA(t, 0.05, 'DSSSB', 300); cast(t, 'naukri_bhaiya', 0.2, 540, 1880, 1050, { talk: [[0.1, 4.5]], pose: [[1.2, 3.0, 'present']] }); }
    else endCard(t, 4.6);
  }}
];
EJ.start();
</script></body></html>
